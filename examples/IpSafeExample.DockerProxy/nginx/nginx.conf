worker_processes 1;

events {
  worker_connections 1024;
}

http {
  server {
    listen 8080;

    location / {
      proxy_pass http://api:8080;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Demo setup: emulate an allowed client IP behind the trusted proxy.
      proxy_set_header X-Forwarded-For 198.51.100.10;
    }
  }
}
